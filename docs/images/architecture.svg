<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Nigerian Retail Banking Intelligence Platform architecture</title>
  <desc id="d">Hugging Face dataset to Bronze Parquet, DuckDB validation, clean staging and dead-letter outputs, BigQuery raw, dbt models and tests, and BigQuery marts.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .name { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
      .sub { font-size: 15px; fill: #333333; }
      .node { opacity: 0; animation: fadeUp 0.6s ease-out forwards; }
      .flow {
        fill: none; stroke: #333333; stroke-width: 2.5;
        stroke-dasharray: 12 10; marker-end: url(#head);
        animation: dash 1.2s linear infinite, fadeIn 0.4s ease-out forwards;
        opacity: 0;
      }
      .caption { font-size: 15px; fill: #555555; font-style: italic; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes dash { to { stroke-dashoffset: -44; } }
      @media (prefers-reduced-motion: reduce) {
        .node, .flow { animation: none; opacity: 1; }
        .flow { stroke-dasharray: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#ffffff"/>
  <text class="title" x="800" y="50">Nigerian Retail Banking Intelligence Platform: Architecture</text>

  <!-- Arrows (drawn first so nodes sit on top) -->
  <path class="flow" style="animation-delay:0.6s, 0.6s" d="M240,340 L300,340"/>
  <path class="flow" style="animation-delay:1.0s, 1.0s" d="M540,340 L590,340"/>
  <path class="flow" style="animation-delay:1.4s, 1.4s" d="M830,330 C870,330 870,205 900,205"/>
  <path class="flow" style="animation-delay:1.4s, 1.4s" d="M830,350 C870,350 870,495 900,495"/>
  <path class="flow" style="animation-delay:1.8s, 1.8s" d="M1140,205 L1190,205"/>
  <path class="flow" style="animation-delay:2.2s, 2.2s" d="M1320,260 L1320,290"/>
  <path class="flow" style="animation-delay:2.6s, 2.6s" d="M1450,365 L1490,365"/>

  <!-- Hugging Face -->
  <g class="node" style="animation-delay:0s">
    <rect x="20" y="280" width="220" height="120" rx="12" fill="#EDEDED" stroke="#444" stroke-width="1.5"/>
    <text class="name" x="130" y="324">Hugging Face dataset</text>
    <text class="sub" x="130" y="354">source snapshot</text>
  </g>

  <!-- Bronze -->
  <g class="node" style="animation-delay:0.2s">
    <rect x="300" y="280" width="240" height="120" rx="12" fill="#CFE2F3" stroke="#444" stroke-width="1.5"/>
    <text class="name" x="420" y="324">Bronze Parquet</text>
    <text class="sub" x="420" y="354">immutable snapshot</text>
  </g>

  <!-- DuckDB -->
  <g class="node" style="animation-delay:0.4s">
    <rect x="590" y="280" width="240" height="120" rx="12" fill="#FFF2CC" stroke="#444" stroke-width="1.5"/>
    <text class="name" x="710" y="324">DuckDB validation</text>
    <text class="sub" x="710" y="354">schema, rules, duplicates</text>
  </g>

  <!-- Clean staging -->
  <g class="node" style="animation-delay:0.8s">
    <rect x="900" y="150" width="240" height="110" rx="12" fill="#FFF2CC" stroke="#444" stroke-width="1.5"/>
    <text class="name" x="1020" y="194">Clean staging Parquet</text>
    <text class="sub" x="1020" y="224">validated rows</text>
  </g>

  <!-- Dead-letter -->
  <g class="node" style="animation-delay:0.8s">
    <rect x="900" y="440" width="240" height="110" rx="12" fill="#F4CCCC" stroke="#444" stroke-width="1.5"/>
    <text class="name" x="1020" y="484">Dead-letter</text>
    <text class="sub" x="1020" y="514">Parquet and CSV</text>
  </g>

  <!-- BigQuery raw -->
  <g class="node" style="animation-delay:1.2s">
    <rect x="1190" y="150" width="260" height="110" rx="12" fill="#D9EAD3" stroke="#444" stroke-width="1.5"/>
    <text class="name" x="1320" y="194">BigQuery raw.transactions</text>
    <text class="sub" x="1320" y="224">loaded records</text>
  </g>

  <!-- dbt -->
  <g class="node" style="animation-delay:1.6s">
    <rect x="1190" y="290" width="260" height="150" rx="12" fill="#D9EAD3" stroke="#444" stroke-width="1.5"/>
    <text class="name" x="1320" y="334">dbt</text>
    <text class="sub" x="1320" y="362">staging, intermediate,</text>
    <text class="sub" x="1320" y="384">marts and tests</text>
  </g>

  <!-- BigQuery marts -->
  <g class="node" style="animation-delay:2.0s">
    <rect x="1490" y="290" width="100" height="150" rx="12" fill="#B6D7A8" stroke="#444" stroke-width="1.5"/>
    <text class="name" x="1540" y="354">BigQuery</text>
    <text class="name" x="1540" y="378">marts</text>
  </g>

  <text class="caption" x="800" y="650">The Python CLI runs download, validation, BigQuery load, and dbt build in sequence.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
