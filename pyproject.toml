[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retail-transactions-intelligence"
version = "0.1.0"
description = "Hugging Face to Snowflake ingestion pipeline prepared for dbt."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "pyarrow",
    "requests",
    "python-dotenv",
    "snowflake-connector-python",
    "snowflake-sqlalchemy",
    "sqlalchemy",
]